<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');

#thakur-page,
#thakur-page *,
#thakur-page *::before,
#thakur-page *::after{
  box-sizing:border-box;
}

#thakur-page{
  position:relative;
  isolation:isolate;
  width:100%;
  min-height:100vh;
  min-height:100svh;
  margin:0;
  padding:35px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#fff;
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(circle at 12% 15%,rgba(255,46,166,.32),transparent 34%),
    radial-gradient(circle at 88% 80%,rgba(85,232,255,.28),transparent 38%),
    linear-gradient(145deg,#020208,#0c0718 50%,#111004);
}

#thakur-page .tp-orb{
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  filter:blur(70px);
  opacity:.34;
  pointer-events:none;
  animation:tp-orb 9s ease-in-out infinite alternate;
}
#thakur-page .tp-orb-one{
  top:-140px;
  right:-140px;
  background:#ff2ea6;
}
#thakur-page .tp-orb-two{
  left:-140px;
  bottom:-140px;
  background:#55e8ff;
  animation-delay:-4s;
}

#thakur-page .tp-grid{
  position:absolute;
  inset:0;
  opacity:.09;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);
  background-size:43px 43px;
  animation:tp-grid 12s linear infinite;
}

#thakur-page .tp-card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:390px;
  min-width:0;
  padding:36px 17px 22px;
  border:1px solid rgba(255,255,255,.11);
  border-radius:27px;
  text-align:center;
  background:rgba(8,7,16,.88);
  box-shadow:
    0 25px 70px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.07);
  animation:tp-entry .8s ease-out;
}

@supports (backdrop-filter:blur(15px)){
  #thakur-page .tp-card{
    background:rgba(8,7,16,.65);
    backdrop-filter:blur(15px);
  }
}

#thakur-page .tp-profile{
  position:relative;
  width:120px;
  height:120px;
  margin:0 auto 22px;
  padding:4px;
  border-radius:50%;
  background:linear-gradient(135deg,#00c6fb,#55e8ff,#fff);
  box-shadow:
    0 0 0 8px rgba(255,255,255,.05),
    0 0 35px rgba(139,77,255,.35);
  animation:tp-float 3s ease-in-out infinite;
}

#thakur-page .tp-profile::after{
  content:"";
  position:absolute;
  inset:-12px;
  border:1px solid rgba(85,232,255,.3);
  border-radius:50%;
  pointer-events:none;
  animation:tp-pulse 2s ease-out infinite;
}

#thakur-page .tp-photo{
  position:relative;
  z-index:1;
  display:block;
  width:100%;
  height:100%;
  max-width:none;
  margin:0;
  object-fit:cover;
  object-position:center 25%;
  border:4px solid #080711;
  border-radius:50%;
}

#thakur-page .tp-crown{
  position:absolute;
  z-index:2;
  top:-29px;
  left:50%;
  transform:translateX(-50%);
  color:#55e8ff;
  font-size:39px;
  line-height:1;
  text-shadow:0 0 16px rgba(85,232,255,.8);
}

#thakur-page .tp-online{
  position:absolute;
  z-index:2;
  right:7px;
  bottom:8px;
  width:21px;
  height:21px;
  border:4px solid #080711;
  border-radius:50%;
  background:#55e8ff;
  box-shadow:0 0 15px rgba(85,232,255,.85);
}

#thakur-page .tp-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin:0 0 14px;
  padding:7px 14px;
  border:1px solid rgba(85,232,255,.28);
  border-radius:999px;
  color:#ffe588;
  background:rgba(244,197,66,.07);
  font-size:9px;
  font-weight:700;
  line-height:1.5;
  letter-spacing:1px;
  text-transform:uppercase;
}

#thakur-page .tp-dot{
  flex:0 0 7px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#55e8ff;
  box-shadow:0 0 11px #55e8ff;
  animation:tp-blink 1.2s ease-in-out infinite;
}

#thakur-page .tp-title{
  margin:0 0 12px;
  padding:0;
  color:#fff;
  font-family:'Poppins',sans-serif;
  font-size:clamp(28px,8.5vw,43px);
  font-weight:900;
  line-height:1.12;
  letter-spacing:-1.4px;
  text-align:center;
  text-transform:uppercase;
  overflow-wrap:anywhere;
}

#thakur-page .tp-title span{
  display:block;
  color:#55e8ff;
}

@supports (-webkit-background-clip:text) or (background-clip:text){
  #thakur-page .tp-title span{
    background:linear-gradient(90deg,#eaffff,#55e8ff,#ff4cc4);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
}

#thakur-page .tp-description{
  max-width:335px;
  margin:0 auto 21px;
  padding:0;
  color:rgba(255,255,255,.68);
  font-size:12.5px;
  font-weight:400;
  line-height:1.65;
}

#thakur-page .tp-button{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  width:100%;
  max-width:312px;
  min-height:53px;
  margin:0 auto;
  padding:15px 12px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.55);
  border-radius:999px;
  color:#fff;
  background:linear-gradient(90deg,#005bea,#00b9ef,#ff2ea6);
  box-shadow:0 15px 38px rgba(111,53,220,.34);
  font-family:'Poppins',sans-serif;
  font-size:12px;
  font-weight:700;
  line-height:1.5;
  letter-spacing:.3px;
  text-align:center;
  text-decoration:none;
  text-transform:uppercase;
  cursor:pointer;
  transition:transform .3s ease,box-shadow .3s ease;
}

#thakur-page .tp-button::before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:60%;
  height:100%;
  transform:skewX(-25deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  pointer-events:none;
  animation:tp-shine 3s ease-in-out infinite;
}

#thakur-page .tp-button svg{
  position:relative;
  z-index:1;
  flex:0 0 21px;
  width:21px;
  height:21px;
}
#thakur-page .tp-button span{
  position:relative;
  z-index:1;
}
#thakur-page .tp-button:focus-visible{
  outline:3px solid #55e8ff;
  outline-offset:5px;
}
#thakur-page .tp-button:active{
  transform:scale(.97);
}

#thakur-page .tp-notice{
  display:flex;
  align-items:center;
  gap:9px;
  width:100%;
  margin:19px auto 0;
  padding:10px;
  border:1px solid rgba(244,197,66,.14);
  border-radius:12px;
  color:rgba(255,255,255,.62);
  background:rgba(255,255,255,.035);
  text-align:left;
  font-size:9.5px;
  line-height:1.5;
}
#thakur-page .tp-age{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 34px;
  height:34px;
  border:2px solid #55e8ff;
  border-radius:50%;
  color:#fff;
  font-size:10px;
  font-weight:800;
}
#thakur-page .tp-brand{
  margin:22px 0 0;
  color:rgba(255,255,255,.4);
  font-size:9px;
  font-weight:600;
  line-height:1.5;
  letter-spacing:2px;
  text-transform:uppercase;
}
#thakur-page .tp-brand strong{
  color:#55e8ff;
  font-weight:800;
}

@keyframes tp-orb{
  to{transform:translate(45px,35px) scale(1.15)}
}
@keyframes tp-grid{
  to{background-position:0 86px}
}
@keyframes tp-entry{
  from{opacity:0;transform:translateY(22px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes tp-float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}
@keyframes tp-pulse{
  from{transform:scale(.9);opacity:.78}
  to{transform:scale(1.2);opacity:0}
}
@keyframes tp-blink{
  50%{opacity:.3}
}
@keyframes tp-shine{
  0%,35%{left:-120%}
  70%,100%{left:150%}
}

@media(hover:hover){
  #thakur-page .tp-button:hover{
    transform:translateY(-3px);
    box-shadow:0 20px 48px rgba(111,53,220,.48);
  }
}

@media(max-width:350px){
  #thakur-page{padding:28px 10px}
  #thakur-page .tp-card{padding:34px 12px 20px}
  #thakur-page .tp-title{font-size:28px}
  #thakur-page .tp-button{font-size:10.5px}
}

@media(max-height:690px){
  #thakur-page{padding-top:25px;padding-bottom:25px}
  #thakur-page .tp-profile{width:100px;height:100px}
  #thakur-page .tp-brand{margin-top:16px}
}

@media(prefers-reduced-motion:reduce){
  #thakur-page *,
  #thakur-page *::before,
  #thakur-page *::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
